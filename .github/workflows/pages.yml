# Builds the demo page (examples/pages-demo) and publishes it to GitHub Pages:
# https://rohanbeingsocial.github.io/showboard/
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "examples/pages-demo/**"
      - "packages/showboard/src/react/**"
      - "packages/showboard/src/spec/**"
      - "assets/showboard-icon.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w pages-demo
      - uses: actions/upload-pages-artifact@v5
        with:
          path: examples/pages-demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
